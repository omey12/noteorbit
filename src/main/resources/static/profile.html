<!DOCTYPE html>
<html>
<head>
<title>Profile</title>

<style>
body{
margin:0;
background:linear-gradient(135deg,#141e30,#243b55);
color:white;
font-family:Arial;
text-align:center;
}

/* BACK BUTTON */
.back{
position:fixed;
top:20px;
left:20px;
width:55px;
height:55px;
border-radius:50%;
background:#00c6ff;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

/* CARD */
.card{
margin:100px auto;
width:350px;
padding:20px;
border-radius:15px;
background:rgba(255,255,255,0.1);
}

/* IMAGE */
img{
width:100px;
height:100px;
border-radius:50%;
margin-bottom:15px;
}

/* TEXT */
p{
margin:8px 0;
}
</style>

</head>

<body>

<div class="back" onclick="location.href='dashboard.html'">Back</div>

<div class="card">

<img id="photo" width="120" style="border-radius:50%">

<h2 id="name">Name</h2>

<p><b>Email:</b> <span id="email"></span></p>
<p><b>Department:</b> <span id="dept"></span></p>
<p><b>Class:</b> <span id="class"></span></p>
<p><b>Year:</b> <span id="year"></span></p>

</div>

<script>

// ✅ user get karo
let user = JSON.parse(localStorage.getItem("user"));

// safe function
function val(x){
    return (x && x !== "undefined") ? x : "Not Available";
}

// ❗ session check
if(user === null){
    alert("Session expired, login again");
    window.location.href = "login.html";
}

// ✅ data set
if(user){
    document.getElementById("name").innerText = val(user.name);
    document.getElementById("email").innerText = val(user.email);
    document.getElementById("dept").innerText = val(user.dept);
    document.getElementById("class").innerText = val(user.className);
    document.getElementById("year").innerText = val(user.year);

    // ✅ photo agar hai to dikhao
    if(user.photo){
        document.getElementById("photo").src = user.photo;
    }
    }else{
        document.getElementById("photo").src = "https://i.imgur.com/6VBx3io.png"; // default avatar
    }


</script>

</body>
</html>
