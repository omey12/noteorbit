<!DOCTYPE html>
<html>
<head>
<title>Register - NoteOrbit</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

/* FULL PAGE BACKGROUND */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#6a11cb,#2575fc,#ff6a00);
background-size:400% 400%;
animation:bgmove 10s infinite alternate;
}

@keyframes bgmove{
0%{background-position:left}
100%{background-position:right}
}

/* CENTER CARD */

.container{
width:900px;
height:500px;
display:flex;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(20px);
border-radius:20px;
overflow:hidden;
box-shadow:0 0 30px rgba(0,0,0,0.5);
}

/* LEFT DESIGN */

.left{
width:50%;
background:linear-gradient(135deg,#6a11cb,#2575fc);
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

.logo{
font-size:42px;
font-weight:bold;
margin-bottom:20px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 10px white }
to{ text-shadow:0 0 30px cyan }
}

.welcome{
font-size:34px;
margin-bottom:10px;
}

.sub{
font-size:18px;
opacity:0.9;
}

/* RIGHT FORM */

.right{
width:50%;
display:flex;
justify-content:center;
align-items:center;
background:#111;
}

.box{
width:300px;
text-align:center;
color:white;
}

h2{
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:10px;
}

/* PASSWORD FIELD */

.passbox{
position:relative;
}

.passbox i{
position:absolute;
right:10px;
top:12px;
cursor:pointer;
color:black;
}

/* BUTTON */

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#00c6ff;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.loginlink{
margin-top:15px;
font-size:14px;
}

.loginlink a{
color:#00c6ff;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<!-- LEFT SIDE -->

<div class="left">

<div class="logo"> NoteOrbit</div>

<div class="welcome">Welcome!</div>

<div class="sub">
Register here to continue access
</div>

</div>

<!-- RIGHT SIDE -->

<div class="right">

<div class="box">

<h2>Create Account</h2>

<input id="name" placeholder="Name">

<input id="email" placeholder="Email">

<div class="passbox">
<input id="password" type="password" placeholder="Password">
<i class="fa fa-eye" onclick="togglePass()"></i>
</div>

<input id="college" placeholder="College">

<input id="dept" placeholder="Department">

<input id="year" placeholder="Year">

<input id="className" placeholder="Class">

<button onclick="register()">Register</button>

<div class="loginlink">
Already have account?
<a href="login.html">Login</a>
</div>

</div>

</div>

</div>

<script>

function togglePass(){
let p=document.getElementById("password");

if(p.type==="password"){
p.type="text";
}else{
p.type="password";
}
}

function register(){

fetch("http://localhost:8383/auth/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:name.value,
email:email.value,
password:password.value,
college:college.value,
dept:dept.value,
year:year.value,
className:className.value

})

})

.then(res=>res.text())

.then(msg=>{

alert(msg);

if(msg.includes("Successful")){
location.href="login.html";
}

});

}

</script>

</body>
</html>
